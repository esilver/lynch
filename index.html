<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Black Lodge</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Crimson+Text:ital@0;1&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blood-red: #8B0000;
            --curtain-red: #722F37;
            --void-black: #0a0a0a;
            --smoke: #1a1a1a;
            --cream: #f5e6d3;
            --flicker: #fff8dc;
        }

        body {
            background-color: var(--void-black);
            color: var(--cream);
            font-family: 'Crimson Text', serif;
            overflow: hidden;
            cursor: pointer;
            height: 100vh;
            width: 100vw;
        }

        /* Audio Controls */
        .audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--curtain-red);
            color: var(--cream);
            padding: 8px 16px;
            font-family: 'Special Elite', cursive;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .audio-control:hover {
            background: var(--curtain-red);
        }

        /* Progress Bar */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 2px;
            background: var(--curtain-red);
            z-index: 10000;
            transition: width 0.5s ease;
        }

        /* Scene Counter */
        .scene-counter {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-family: 'Special Elite', cursive;
            font-size: 0.8rem;
            opacity: 0.4;
            z-index: 10000;
        }

        /* Static Overlay */
        .static-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
            animation: staticFlicker 0.1s infinite;
        }

        @keyframes staticFlicker {
            0%, 100% { opacity: 0.02; }
            50% { opacity: 0.04; }
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            background: radial-gradient(ellipse at center, transparent 0%, transparent 40%, rgba(0,0,0,0.8) 100%);
        }

        /* Scene Container */
        .scene-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease;
            padding: 2rem;
        }

        .scene-container.active {
            opacity: 1;
        }

        .scene-container.fade-out {
            opacity: 0;
        }

        /* Scene Content */
        .scene-content {
            max-width: 800px;
            text-align: center;
            position: relative;
        }

        .scene-text {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            line-height: 2;
            font-style: italic;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .scene-text.large {
            font-size: clamp(2rem, 6vw, 4rem);
            font-family: 'Playfair Display', serif;
            font-style: normal;
            letter-spacing: 0.2em;
        }

        .scene-text.small {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            opacity: 0.7;
        }

        .scene-text.typewriter {
            font-family: 'Special Elite', cursive;
            font-style: normal;
        }

        .scene-text.red {
            color: var(--curtain-red);
        }

        .scene-text.backwards {
            direction: rtl;
            unicode-bidi: bidi-override;
        }

        .scene-text.glitch {
            animation: textGlitch 0.3s infinite;
        }

        @keyframes textGlitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 1px); }
            40% { transform: translate(2px, -1px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 1px); }
        }

        /* Click Prompt */
        .click-prompt {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Special Elite', cursive;
            font-size: 0.9rem;
            opacity: 0;
            animation: pulsePrompt 2s ease-in-out infinite;
            animation-delay: 2s;
            z-index: 10000;
        }

        @keyframes pulsePrompt {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        /* Special Scene Styles */
        .curtains {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .curtain-left, .curtain-right {
            position: absolute;
            top: 0;
            width: 15%;
            height: 100%;
            background: linear-gradient(90deg,
                var(--blood-red) 0%,
                var(--curtain-red) 40%,
                #4a1c1c 70%,
                transparent 100%
            );
        }

        .curtain-left {
            left: 0;
        }

        .curtain-right {
            right: 0;
            transform: scaleX(-1);
        }

        .curtains.hidden {
            opacity: 0;
            transition: opacity 2s;
        }

        /* Chevron Floor */
        .chevron-floor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: repeating-linear-gradient(
                90deg,
                #1a1a1a 0px,
                #1a1a1a 30px,
                #f5e6d3 30px,
                #f5e6d3 60px
            );
            opacity: 0;
            transform: perspective(500px) rotateX(70deg);
            transform-origin: bottom;
            transition: opacity 2s;
            z-index: 50;
        }

        .chevron-floor.visible {
            opacity: 0.15;
        }

        /* Background Effects */
        .bg-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            transition: opacity 2s;
        }

        .bg-forest {
            background:
                radial-gradient(ellipse at 20% 80%, rgba(0, 30, 0, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(0, 20, 0, 0.2) 0%, transparent 40%),
                linear-gradient(180deg, #0a0a0a, #0a1a0a);
        }

        .bg-red {
            background: radial-gradient(ellipse at center, rgba(139, 0, 0, 0.2) 0%, var(--void-black) 70%);
        }

        .bg-blue {
            background: radial-gradient(ellipse at center, rgba(0, 0, 50, 0.3) 0%, var(--void-black) 70%);
        }

        .bg-fire {
            background:
                radial-gradient(ellipse at 50% 100%, rgba(139, 0, 0, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 30% 90%, rgba(200, 50, 0, 0.2) 0%, transparent 30%),
                radial-gradient(ellipse at 70% 95%, rgba(200, 100, 0, 0.15) 0%, transparent 25%);
            animation: fireFlicker 0.5s infinite;
        }

        @keyframes fireFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .bg-static {
            animation: intenseStatic 0.1s infinite;
        }

        @keyframes intenseStatic {
            0% { filter: brightness(1); }
            25% { filter: brightness(1.1); }
            50% { filter: brightness(0.9); }
            75% { filter: brightness(1.05); }
            100% { filter: brightness(1); }
        }

        /* Floating Elements */
        .floating-symbol {
            position: fixed;
            font-size: 3rem;
            opacity: 0;
            pointer-events: none;
            z-index: 60;
            transition: opacity 2s;
        }

        .floating-symbol.visible {
            opacity: 0.15;
            animation: floatSymbol 10s ease-in-out infinite;
        }

        @keyframes floatSymbol {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        /* Flashing */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 99999;
            transition: opacity 0.1s;
        }

        /* Character Silhouette */
        .silhouette {
            position: fixed;
            bottom: 10%;
            font-size: 15rem;
            opacity: 0;
            transition: opacity 3s;
            z-index: 55;
            filter: brightness(0);
        }

        .silhouette.visible {
            opacity: 0.3;
        }

        /* Door */
        .door {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 280px;
            background: linear-gradient(180deg, #1a0a0a, #0a0505);
            border: 2px solid #2a1a1a;
            opacity: 0;
            transition: opacity 2s;
            z-index: 70;
            box-shadow:
                inset 0 0 50px rgba(0,0,0,0.9),
                0 0 100px rgba(0,0,0,0.8);
        }

        .door::before {
            content: '';
            position: absolute;
            right: 15px;
            top: 50%;
            width: 12px;
            height: 12px;
            background: #5a4a3a;
            border-radius: 50%;
        }

        .door::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 3px;
            background: var(--flicker);
            box-shadow: 0 0 20px var(--flicker), 0 0 40px var(--flicker);
            animation: doorLight 2s infinite;
        }

        .door.visible {
            opacity: 1;
        }

        @keyframes doorLight {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.4; }
        }

        /* Title Screen Special */
        .title-screen .scene-text {
            animation: titlePulse 4s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 0 30px rgba(139, 0, 0, 0.3); }
            50% { text-shadow: 0 0 60px rgba(139, 0, 0, 0.6), 0 0 100px rgba(139, 0, 0, 0.3); }
        }

        /* Breathing */
        .breathing {
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Loading */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--void-black);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            transition: opacity 1s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading p {
            font-family: 'Special Elite', cursive;
            animation: loadingPulse 1.5s infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="loading"><p>click anywhere to begin...</p></div>

    <div class="static-overlay"></div>
    <div class="vignette"></div>
    <div class="flash-overlay" id="flash"></div>

    <div class="curtains hidden" id="curtains">
        <div class="curtain-left"></div>
        <div class="curtain-right"></div>
    </div>

    <div class="chevron-floor" id="chevronFloor"></div>

    <div class="bg-effect" id="bgEffect"></div>

    <div class="floating-symbol" id="floatingSymbol" style="top: 20%; left: 15%;">🦉</div>
    <div class="silhouette" id="silhouette">🚶</div>
    <div class="door" id="door"></div>

    <button class="audio-control" id="audioBtn">♪ SOUND ON</button>
    <div class="progress-bar" id="progressBar"></div>
    <div class="scene-counter" id="sceneCounter"></div>

    <div class="scene-container" id="sceneContainer">
        <div class="scene-content">
            <p class="scene-text" id="sceneText"></p>
        </div>
    </div>

    <div class="click-prompt" id="clickPrompt">click to continue</div>

    <script>

        const scenes = [

            { text: "51,200", classes: "typewriter", bg: "forest" },
            { text: "Someone has just died.", classes: "red", bg: "forest" },

            // THE BODY
            { text: "•", classes: "large", bg: "", pause: true },
            { text: "Down by the river, wrapped in plastic.", classes: "", bg: "blue" },

            { text: "Time moves differently here.", classes: "small", bg: "blue" },

            // THE DINER
            { text: "•", classes: "large", bg: "", pause: true },
            { text: "You need coffee.", classes: "", bg: "" },

            { text: ".sdrawkcab", classes: "backwards large", bg: "red", curtains: true, floor: true },

            { text: "Click to return to the beginning.", classes: "small typewriter", bg: "", final: true },

        // ============================================
        // AUDIO ENGINE
        // ============================================
        let audioContext = null;
        let audioEnabled = false;
        let droneOsc = null;
        let droneGain = null;
        let lfoOsc = null;

        function initAudio() {
            if (audioContext) return;

            audioContext = new (window.AudioContext || window.webkitAudioContext)();

            // Main drone
            droneGain = audioContext.createGain();
            droneGain.gain.value = 0;
            droneGain.connect(audioContext.destination);

            // Base drone oscillator
            droneOsc = audioContext.createOscillator();
            droneOsc.type = 'sine';
            droneOsc.frequency.value = 55; // Low A

            // Second oscillator for richness
            const drone2 = audioContext.createOscillator();
            drone2.type = 'sine';
            drone2.frequency.value = 82.5; // E

            // Third oscillator - very low
            const drone3 = audioContext.createOscillator();
            drone3.type = 'sine';
            drone3.frequency.value = 36.7; // Low D

            // LFO for subtle modulation
            lfoOsc = audioContext.createOscillator();
            lfoOsc.type = 'sine';
            lfoOsc.frequency.value = 0.1;

            const lfoGain = audioContext.createGain();
            lfoGain.gain.value = 3;

            lfoOsc.connect(lfoGain);
            lfoGain.connect(droneOsc.frequency);

            // Filter for warmth
            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 200;
            filter.Q.value = 1;

            droneOsc.connect(filter);
            drone2.connect(filter);
            drone3.connect(filter);
            filter.connect(droneGain);

            droneOsc.start();
            drone2.start();
            drone3.start();
            lfoOsc.start();
        }

        function setAudioMood(mood) {
            if (!audioContext || !audioEnabled) return;

            const now = audioContext.currentTime;

            switch(mood) {
                case 'forest':
                    droneOsc.frequency.linearRampToValueAtTime(45, now + 2);
                    break;
                case 'red':
                    droneOsc.frequency.linearRampToValueAtTime(65, now + 2);
                    break;
                case 'fire':
                    droneOsc.frequency.linearRampToValueAtTime(80, now + 1);
                    lfoOsc.frequency.linearRampToValueAtTime(0.5, now + 1);
                    break;
                case 'static':
                    droneOsc.frequency.linearRampToValueAtTime(100, now + 0.5);
                    break;
                case 'blue':
                    droneOsc.frequency.linearRampToValueAtTime(50, now + 2);
                    break;
                default:
                    droneOsc.frequency.linearRampToValueAtTime(55, now + 2);
                    lfoOsc.frequency.linearRampToValueAtTime(0.1, now + 2);
            }
        }

        function toggleAudio() {
            if (!audioContext) initAudio();

            audioEnabled = !audioEnabled;
            const btn = document.getElementById('audioBtn');

            if (audioEnabled) {
                audioContext.resume();
                droneGain.gain.linearRampToValueAtTime(0.15, audioContext.currentTime + 1);
                btn.textContent = '♪ SOUND OFF';
            } else {
                droneGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.5);
                btn.textContent = '♪ SOUND ON';
            }
        }

        // ============================================
        // SCENE ENGINE
        // ============================================
        let currentScene = -1;
        let isTransitioning = false;
        let started = false;

        const elements = {
            loading: document.getElementById('loading'),
            container: document.getElementById('sceneContainer'),
            text: document.getElementById('sceneText'),
            progress: document.getElementById('progressBar'),
            counter: document.getElementById('sceneCounter'),
            curtains: document.getElementById('curtains'),
            floor: document.getElementById('chevronFloor'),
            bgEffect: document.getElementById('bgEffect'),
            symbol: document.getElementById('floatingSymbol'),
            flash: document.getElementById('flash'),
            silhouette: document.getElementById('silhouette'),
            door: document.getElementById('door'),
            clickPrompt: document.getElementById('clickPrompt')
        };

        function updateProgress() {
            const progress = ((currentScene + 1) / scenes.length) * 100;
            elements.progress.style.width = progress + '%';
            elements.counter.textContent = `${currentScene + 1} / ${scenes.length}`;
        }

        function applySceneEffects(scene) {
            // Background
            elements.bgEffect.className = 'bg-effect';
            if (scene.bg) {
                elements.bgEffect.classList.add('bg-' + scene.bg);
                setAudioMood(scene.bg);
            } else {
                setAudioMood('default');
            }

            // Curtains
            if (scene.curtains) {
                elements.curtains.classList.remove('hidden');
            } else {
                elements.curtains.classList.add('hidden');
            }

            // Floor
            if (scene.floor) {
                elements.floor.classList.add('visible');
            } else {
                elements.floor.classList.remove('visible');
            }

            // Symbol
            if (scene.symbol) {
                elements.symbol.textContent = scene.symbol;
                elements.symbol.classList.add('visible');
            } else {
                elements.symbol.classList.remove('visible');
            }

            // Door
            if (scene.door) {
                elements.door.classList.add('visible');
            } else {
                elements.door.classList.remove('visible');
            }

            // Silhouette
            if (scene.silhouette) {
                elements.silhouette.classList.add('visible');
            } else {
                elements.silhouette.classList.remove('visible');
            }

            // Flash
            if (scene.flash) {
                elements.flash.style.opacity = '1';
                setTimeout(() => {
                    elements.flash.style.opacity = '0';
                }, 100);
            }
        }

        function showScene(index) {
            if (index >= scenes.length) {
                index = 0; // Loop back
            }

            if (isTransitioning) return;
            isTransitioning = true;

            const scene = scenes[index];

            // Fade out
            elements.container.classList.add('fade-out');
            elements.container.classList.remove('active');

            setTimeout(() => {
                // Update content
                elements.text.textContent = scene.text;
                elements.text.className = 'scene-text ' + (scene.classes || '');

                // Apply effects
                applySceneEffects(scene);

                // Fade in
                elements.container.classList.remove('fade-out');
                elements.container.classList.add('active');

                currentScene = index;
                updateProgress();

                isTransitioning = false;
            }, 800);
        }

        function nextScene() {
            if (!started) {
                started = true;
                elements.loading.classList.add('hidden');
                initAudio();
                showScene(0);
                return;
            }

            if (isTransitioning) return;

            const nextIndex = currentScene + 1;
            if (nextIndex >= scenes.length) {
                showScene(0);
            } else {
                showScene(nextIndex);
            }
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        document.body.addEventListener('click', (e) => {
            if (e.target.id === 'audioBtn') return;
            nextScene();
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') {
                e.preventDefault();
                nextScene();
            }
            if (e.code === 'ArrowLeft' && currentScene > 0) {
                showScene(currentScene - 1);
            }
        });

        document.getElementById('audioBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleAudio();
        });

        // Prevent context menu
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
